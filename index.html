<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f5f0"><title>Kappy | Care together</title><link rel="stylesheet" href="./styles.css?v=0.9.0-beta"><style>.tabs,#panel{display:none!important}.kappy-live-nav{display:flex;gap:.5rem;overflow-x:auto;padding:.75rem 0;position:sticky;top:0;background:#f7f5f0;z-index:2}.kappy-live-nav button{white-space:nowrap;border-radius:1rem;padding:.65rem .9rem;border:1px solid #bbb;background:#fff}.kappy-live-nav button.active{background:#254d43;color:white;border-color:#254d43}[data-pane][hidden]{display:none!important}#live-workspace{min-width:0}#live-workspace .card{max-width:100%}</style></head><body><section id="splash" class="splash" aria-label="Welcome to Kappy"><div class="splash-inner"><div class="heartmark splash-heart" aria-hidden="true"><span class="heart-left">♥</span><span class="heart-right">♥</span></div><div class="splash-wordmark">kappy<span class="dot">.</span></div><form id="onboarding-form" class="onboarding" hidden><label for="display-name">What should we call you?</label><input id="display-name" name="displayName" maxlength="60" autocomplete="given-name" required placeholder="Your name"><p class="muted">This name appears on your calendar requests and messages. You can choose what people call you.</p><p id="onboarding-error" role="alert" hidden></p><button class="button" type="submit">Continue to Kappy</button></form><div class="splash-actions"><p id="splash-status" role="status">Checking your session…</p><button id="splash-google" class="button" type="button" hidden>Continue with Google</button><label class="remember"><input id="stay-signed-in" type="checkbox" checked> Stay signed in on this device</label><button id="splash-enter" class="button alt" type="button" hidden>Enter Kappy</button></div></div></section><div class="app" id="kappy-app" hidden><header class="top"><a class="brand" href="#calendar"><span class="heartmark brand-heart" aria-hidden="true"><span class="heart-left">♥</span><span class="heart-right">♥</span></span> kappy<span class="dot">.</span></a><span class="version" aria-label="App version">Kappy v0.9.0-beta</span><section class="auth-bar" aria-label="Account"><span id="auth-status" role="status">Checking sign-in…</span><button id="google-login" type="button">Continue with Google</button><button id="google-logout" type="button" hidden>Sign out</button></section></header><nav class="tabs" aria-label="Main sections"><button data-tab="calendar">Calendar</button><button data-tab="messages">Messages</button><button data-tab="wellbeing">Wellbeing</button><button data-tab="people">People</button></nav><section id="live-workspace" aria-label="Shared team records"></section><main id="panel" tabindex="-1" aria-live="polite"></main><footer>Private beta · Live team workspace. Use synthetic data only until beta security approval. <span>Kappy is a working name.</span></footer></div><script>window.addEventListener("error",function(e){const p=document.getElementById("panel");if(p&&!p.hasChildNodes()){p.textContent="Kappy could not start: "+(e.message||"Script failed to load")+". Please report this message with version v0.5.4."}});</script><script src="./script.js?v=0.9.0-beta"></script><script type="module" src="./auth.js?v=0.9.0-beta"></script></body></html>
