name: Validate Kappy prototype
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check script.js
      - name: Run prototype tests
        run: node --test tests/*.test.mjs
      - name: Install Chromium browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run mobile Chromium interaction test
        run: node tests/mobile-browser.mjs
      - name: Verify version header
        run: grep -q 'Kappy v0.5.0' index.html
